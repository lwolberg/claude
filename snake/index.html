<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #111; color: #eee; font-family: sans-serif; }
  canvas { background: #1b1b1b; border: 2px solid #444; max-width: 95vw; touch-action: none; }
  #score { margin: 8px 0; font-size: 18px; }
  #hint { margin-top: 8px; font-size: 13px; color: #888; }
</style>
</head>
<body>
<div id="score">Score: 0</div>
<canvas id="game" width="400" height="400"></canvas>
<div id="hint">Arrow keys / WASD / swipe to move. Space or tap to restart.</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const SIZE = 20, CELLS = canvas.width / SIZE, TICK_MS = 110;
  let snake, dir, nextDir, food, score, dead;

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = nextDir = { x: 1, y: 0 };
    score = 0; dead = false;
    placeFood();
    scoreEl.textContent = 'Score: 0';
  }

  function placeFood() {
    do {
      food = { x: Math.floor(Math.random() * CELLS), y: Math.floor(Math.random() * CELLS) };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function turn(x, y) {
    if (x === -dir.x && y === -dir.y) return; // no reversing
    nextDir = { x, y };
  }

  function step() {
    if (dead) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      dead = true;
    } else {
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = 'Score: ' + score;
        placeFood();
      } else {
        snake.pop();
      }
    }
    draw();
  }

  function draw() {
    ctx.fillStyle = '#1b1b1b';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(food.x * SIZE + 2, food.y * SIZE + 2, SIZE - 4, SIZE - 4);
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#2ecc71' : '#27ae60';
      ctx.fillRect(s.x * SIZE + 1, s.y * SIZE + 1, SIZE - 2, SIZE - 2);
    });
    if (dead) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = '28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Game over', canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = '16px sans-serif';
      ctx.fillText('Score ' + score + ' - press Space or tap to restart', canvas.width / 2, canvas.height / 2 + 20);
    }
  }

  const keys = {
    ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1],
    ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0],
  };
  document.addEventListener('keydown', e => {
    if (e.key === ' ' && dead) { reset(); draw(); e.preventDefault(); return; }
    const k = keys[e.key] || keys[e.key.toLowerCase()];
    if (k) { turn(k[0], k[1]); e.preventDefault(); }
  });

  let touch = null;
  canvas.addEventListener('touchstart', e => {
    if (dead) { reset(); draw(); return; }
    touch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  canvas.addEventListener('touchend', e => {
    if (!touch) return;
    const dx = e.changedTouches[0].clientX - touch.x, dy = e.changedTouches[0].clientY - touch.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 20) {
      if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0); else turn(0, Math.sign(dy));
    }
    touch = null;
  });
  canvas.addEventListener('click', () => { if (dead) { reset(); draw(); } });

  reset();
  draw();
  setInterval(step, TICK_MS);
})();
</script>
</body>
</html>
